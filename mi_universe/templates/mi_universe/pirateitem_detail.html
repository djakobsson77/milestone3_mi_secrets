{#  {% extends "base.html" %}  #}

{% load static %}

{% block content %}
<h1>{{ item.name }}</h1>

<p>{{ item.description|linebreaksbr }}</p>

{% if item.image_file %}
    <img src="{% static 'mi_universe/images/' %}{{ item.image_file }}" 
         alt="{{ item.name }}" 
         style="max-width: 400px; height: auto;">
{% endif %}

<p>
    <a href="{% url 'pirateitem_list' %}">Back to Pirate Items</a>
</p>

{% endblock %}
