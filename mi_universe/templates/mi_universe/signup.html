{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="container my-5 text-center mi-text-700">
    <h2>Create account</h2>

    <form method="POST" class="mx-auto" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning mt-3">Sign up</button>
    </form>
</section>
{% endblock %}
