{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Island Universe</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'mi_universe/css/style.css' %}">

</head>

<body class="d-flex flex-column min-vh-100">

<header>
    <nav id="navbar" class="navbar navbar-expand-sm mi-navbar">
        <div class="container">

            <div class="navbar-brand text-warning">
                Monkey Island
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'home' %}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'character_list' %}">Characters</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'island_list' %}">Islands</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'pirateitem_list' %}">Pirate Items</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
</header>

<main class="flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<footer class="mi-footer mt-auto">
    <div class="container text-center py-3">

        <h5 class="text-warning mb-2">Contact me</h5>

        <form class="mi-contact-form" method="POST" action="#">
            {% csrf_token %}
            <div class="row g-2 justify-content-center">

                <div class="col-12 col-md-4">
                    <input type="text" name="name" placeholder="Name" required>
                </div>

                <div class="col-12 col-md-4">
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="col-12 col-md-8">
                    <textarea name="message" placeholder="Message" required></textarea>
                </div>

                <div class="col-12 col-md-8">
                    <button type="submit">Send</button>
                </div>

            </div>
        </form>

        <p class="text-warning mt-3 mb-0">Daniel Jacobsson - Monkey Island Universe © 2026</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
